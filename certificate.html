<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate of Completion</title>
    <link rel="stylesheet" href="cartificate.css">
</head>
<body>
    <div class="certificate-container">
        <div class="certificate-border">
            <div class="certificate-header">
                <img src="fantsuam.jpg" alt="Fantsuam Foundation Logo" class="logo">
                <h1>FANTSUAM FOUNDATION Zittnet Academy</h1>
             </div>
            <div class="certificate-body">
            <p>This  certifies that</p>
            <h2 id="student-name">[Student's Name]</h2>
            <p>successfully completed the</p>
            <h2 id="course-name">Responsive Web Design</h2>
            <p>Developer Certification on August 2024</p>
            </div>
            <div class="certificate-footer">
                <div class="signature">
                    <img src="signature.png" alt="Signature" class="signature-image">
                    <p>ADEOTI SUNDAY</p>
                    <p>H.O.D</p>
                </div>
                <div class="seal">
                    <img src="seal.png" alt="Official Seal" class="seal-image">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
